name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # чтобы выложить APK в релиз «latest»

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Постоянная ссылка для телефона: <репозиторий>/releases/latest
      - name: Publish to release "latest"
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ScreenTranslator.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScreenTranslator.apk \
            --title "Последняя сборка" \
            --notes "Сборка ${GITHUB_SHA::7}. Скачайте ScreenTranslator.apk и установите поверх старой версии." \
            --target "$GITHUB_SHA"
